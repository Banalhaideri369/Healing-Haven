[build]
  base    = "artifacts/ban-al-haidari"
  command = "corepack enable && pnpm install && pnpm run build"
  publish = "dist/public"
  ignore  = "exit 1"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
